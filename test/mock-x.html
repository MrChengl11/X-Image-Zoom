<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock X photo viewer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #000; color: #e7e9ea; font-family: system-ui, sans-serif; }
    body { min-height: 3000px; }
    .timeline { width: min(560px, 100%); margin: 0 auto; border-left: 1px solid #2f3336; border-right: 1px solid #2f3336; min-height: 2600px; }
    .tweet { padding: 14px 16px; border-bottom: 1px solid #2f3336; }
    .tweet p { margin: 8px 0; }
    #thumb { display: block; width: 100%; max-height: 260px; object-fit: cover; border-radius: 16px; cursor: pointer; }
    #bg-video { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; background: #1a1a1a; object-fit: cover; }
    #bg-video[hidden] { display: none; }
    #viewer { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.92); }
    #viewer[hidden] { display: none; }
    [data-testid="swipe-to-dismiss"] { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    #photo-link { display: flex; max-width: 78vw; max-height: 78vh; }
    #photo { display: block; width: 900px; height: 600px; max-width: 78vw; max-height: 78vh; object-fit: cover; user-select: none; -webkit-user-drag: none; }
    #close { position: absolute; top: 16px; right: 20px; z-index: 2; width: 40px; height: 40px; border: 0; border-radius: 999px; background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }
    #hint { position: fixed; left: 16px; bottom: 16px; z-index: 2; color: #8b98a5; font-size: 13px; }
    #small-dialog { position: fixed; left: 40px; top: 40px; z-index: 200; width: 420px; height: 320px; padding: 10px; background: #16181c; border: 1px solid #2f3336; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    #small-dialog[hidden] { display: none; }
    #small-dialog-photo { display: block; width: 400px; height: 300px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>
  <main class="timeline">
    <section class="tweet">
      <p><strong>Mock user</strong> · 2h</p>
      <p>This page imitates X's full-screen photo viewer for automated tests.</p>
      <img id="thumb" alt="Timeline thumbnail" src="https://pbs.twimg.com/media/mock.svg">
    </section>
    <div style="height: 2400px"></div>
  </main>

  <video id="bg-video" muted playsinline aria-hidden="true" hidden></video>

  <div id="viewer" role="dialog" aria-modal="true" aria-label="Photo">
    <div data-testid="swipe-to-dismiss">
      <a id="photo-link" href="#photo" draggable="false">
        <img id="photo" alt="Image" draggable="false" src="https://pbs.twimg.com/media/mock.svg">
      </a>
      <video id="viewer-video" hidden muted playsinline aria-hidden="true"
        style="position:absolute;inset:0;z-index:3;width:100%;height:100%;object-fit:cover;background:#123"></video>
    </div>
    <button id="close" data-testid="app-bar-close" aria-label="Close">×</button>
    <div id="drawer-panel" hidden
      style="position:absolute;right:120px;top:200px;width:380px;padding:12px;z-index:4;background:#111;border-radius:12px">
      <article>
        <img id="drawer-photo" alt="Drawer photo"
          src="https://pbs.twimg.com/media/mock-drawer.svg"
          style="display:block;width:100%;height:220px;object-fit:cover;border-radius:8px">
      </article>
    </div>
  </div>
  <div id="hint">wheel = zoom · drag = pan · scroll out = reset</div>

  <!-- A regular, non-full-screen dialog (like a compose attachment preview).
       It must not be mistaken for the photo viewer. -->
  <div id="small-dialog" role="dialog" aria-label="Compose" hidden>
    <img id="small-dialog-photo" alt="Attachment preview" src="https://pbs.twimg.com/media/mock-small.svg">
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const stage = document.querySelector('[data-testid="swipe-to-dismiss"]');

    // X's photo viewer locks the page behind it. Keep the mock realistic so
    // no-op wheel events (which the extension now lets through) stay harmless.
    const syncScrollLock = () => {
      document.body.style.overflow = viewer.hidden ? '' : 'hidden';
    };
    new MutationObserver(syncScrollLock).observe(viewer, {
      attributes: true,
      attributeFilter: ['hidden'],
    });
    syncScrollLock();
    document.getElementById('close').addEventListener('click', () => {
      viewer.hidden = true;
    });
    document.getElementById('thumb').addEventListener('click', () => {
      viewer.hidden = false;
    });
    window.__mockClicks = 0;
    viewer.addEventListener('click', (event) => {
      window.__mockClicks += 1;
      // X closes the photo viewer when the dark backdrop is clicked.
      if (event.target === viewer || event.target === stage) {
        viewer.hidden = true;
      }
    });
  </script>
</body>
</html>
